apiVersion: apps/v1
kind: Deployment
metadata: 
  name: my-appp-deployment
  labels:
    tier: frontend
    app: nginx
    

spec:
  selector: 
    matchLabels:
      app: my-app
  replicas: 3
  template: 
    metadata:
      name: nginx-2
      labels:
        app: my-app
    spec:
      containers:
        - name: nginx
          image: nginx